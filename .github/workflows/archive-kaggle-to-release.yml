name: Archive Kaggle dataset to private Release

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Which Kaggle dataset to back up (run once for each)'
        required: true
        type: choice
        options:
          - radio
          - geometry
      version:
        description: 'Optional exact Kaggle dataset version; blank means automatically resolve and pin the current version'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: kaggle-release-${{ inputs.dataset }}
  cancel-in-progress: false

jobs:
  cloud_archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out archival script
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install 'requests>=2.32,<3'
      - name: Stream Kaggle archive in 900 MiB parts to existing private Release
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          BACKUP_DATASET: ${{ inputs.dataset }}
          BACKUP_VERSION: ${{ inputs.version }}
        run: |
          python tools/kaggle_to_release_stream.py --dataset "$BACKUP_DATASET" --version "$BACKUP_VERSION"
