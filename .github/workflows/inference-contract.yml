name: TSRG inference contract tests

on:
  push:
    branches: [feature/inference-download-v1]
  pull_request:

jobs:
  cpu-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile inference and release tools
        run: python -m compileall -q tsrg tests tools/build_download_zip.py
      - name: Check command-line help without a GPU
        run: python -m tsrg.inference --help
      - name: Run unit tests
        run: python -m pytest -q
      - name: Build curated private download package
        run: python tools/build_download_zip.py
      - name: Recheck archive contents and hashes
        run: python tools/build_download_zip.py --verify dist/TSRG-inference-v0.1.0-rc1.zip
      - name: Upload private download candidate
        uses: actions/upload-artifact@v4
        with:
          name: TSRG-inference-private-v0.1.0-rc1
          path: dist/TSRG-inference-v0.1.0-rc1.zip
          if-no-files-found: error
          retention-days: 30
