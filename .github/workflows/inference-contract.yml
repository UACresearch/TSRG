name: TSRG inference contract tests

on:
  push:
    branches: [feature/inference-download-v1]
  pull_request:

jobs:
  cpu-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile new inference module
        run: python -m compileall -q tsrg tests
      - name: Run unit tests
        run: python -m pytest -q
